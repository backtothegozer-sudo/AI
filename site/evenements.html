<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Évènements | Underside</title>
  <meta name="description" content="Page évènements temporairement désactivée. Underside publiera prochainement un nouvel évènement." />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <link rel="canonical" href="https://ai.underside.be/evenements" />
  <link rel="alternate" hreflang="fr" href="https://ai.underside.be/evenements" />
  <link rel="alternate" hreflang="en" href="https://ai.underside.be/en/evenements" />
  <link rel="alternate" hreflang="x-default" href="https://ai.underside.be/evenements" />

  <link rel="icon" href="logo-underside-fav.svg?v=20260328a" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico?v=20260328a" sizes="any" />
  <link rel="shortcut icon" href="favicon.ico?v=20260328a" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260328a" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png?v=20260328a" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png?v=20260328a" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260328a" />

  <style>
    :root {
      --bg:#060607;
      --ink:#f5f7fb;
      --ink-2:#cfd4df;
      --line:rgba(255,255,255,.12);
      --accent:#e64bff;
      --accent2:#4b5bff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100dvh;
      font-family:Manrope,system-ui,sans-serif;
      color:var(--ink);
      background:radial-gradient(1100px 420px at 55% -20%, rgba(230,75,255,.2), transparent 70%), var(--bg);
      display:flex;
      flex-direction:column;
    }
    header {
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(6,6,7,.92);
      backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav {
      max-width:1200px;
      margin:0 auto;
      padding:20px 22px;
      display:flex;
      align-items:center;
    }
    .brand img { height:52px; width:auto; display:block; }
    main {
      flex:1;
      display:grid;
      place-items:center;
      padding:40px 20px 120px;
    }
    .card {
      width:min(760px, 100%);
      border:1px solid var(--line);
      border-radius:24px;
      padding:34px;
      background:linear-gradient(150deg, rgba(230,75,255,.12), rgba(75,91,255,.05) 45%, rgba(255,255,255,.02));
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      text-align:center;
    }
    h1 {
      margin:0 0 12px;
      font-size:clamp(30px, 5vw, 48px);
      line-height:1.05;
    }
    p { margin:0; color:var(--ink-2); font-size:18px; line-height:1.6; }
    .actions {
      margin-top:28px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--ink);
      text-decoration:none;
      background:rgba(255,255,255,.03);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .btn.primary {
      border:none;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 10px 30px rgba(230,75,255,.35);
    }
    .btn:hover { transform:translateY(-1px); }

    .lang-switch {
      position:fixed;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      display:flex;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(6,6,7,.85);
      backdrop-filter: blur(8px);
      padding:4px;
      z-index:20;
    }
    .lang-switch a {
      text-decoration:none;
      color:var(--ink-2);
      font-size:14px;
      padding:7px 12px;
      border-radius:999px;
    }
    .lang-switch a.active {
      color:var(--ink);
      background:linear-gradient(135deg, rgba(230,75,255,.45), rgba(75,91,255,.45));
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="https://www.underside.be" aria-label="Aller vers www.underside.be">
        <img src="Underside2018_blanc.png" alt="Underside" />
      </a>
    </nav>
  </header>

  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Page évènements temporairement désactivée</h1>
      <p>Cette page est en pause pour préparer le prochain évènement Underside. Revenez bientôt.</p>
      <div class="actions">
        <a class="btn primary" href="index.html">Retour à l'accueil</a>
        <a class="btn" href="actualites.html">Voir les actualités</a>
      </div>
    </section>
  </main>

  <nav class="lang-switch" aria-label="Choix de langue">
    <a class="active" href="evenements.html" lang="fr">FR</a>
    <a href="en/evenements.html" lang="en">EN</a>
  </nav>
</body>
</html>
